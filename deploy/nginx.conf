server {
    listen 80;
    listen 3000;   # Coolify's default "Ports Exposes", so either setting works
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript;   # text/html is always compressed
    gzip_min_length 1024;

    # Health check for Coolify / Docker, never behind the password
    location = /healthz {
        access_log off;
        auth_basic off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        # written by /docker-entrypoint.d/40-basic-auth.sh
        include /etc/nginx/auth.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header Referrer-Policy no-referrer;
    }
}
